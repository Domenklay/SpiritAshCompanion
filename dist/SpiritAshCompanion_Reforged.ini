[Companion]
; Select one companion. Restart the game after changing Preset.
; 0 = Cleanrot Knight Finlay +10
; 1 = Jarwight Puppet +10 (pot thrower)
; 2 = Mimic Tear +10
; 3 = Tarnished +10 (Nepheli Loux Puppet, melee human companion)
Preset=0

EnableSummonAnywhere=1
ForceBuddyActivation=1
PreventManagerDisappear=1
StartDelayMs=8000

; Stable cached Fury: one identity acquisition after summon,
; then only cached Fury rearm every 22 seconds. No healthy-state ChrSet/SpEffect scans.
ForceSpiritFury=1
EnableRealItemFuryPulse=0

[DebugNPC]
Enabled=0
